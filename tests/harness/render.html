<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LT26 render harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000e29;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .marker {
        position: fixed;
        border: 2px solid #ff00ff;
        border-radius: 50%;
        pointer-events: none;
      }
      #mascot {
        position: fixed;
        inset: 0;
        background: #3a6;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="./render-harness.ts"></script>
  </body>
</html>
