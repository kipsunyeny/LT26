name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: lint, unit tests, production build and the static-folder check (sub-path + root, 6 MB budget).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run static-check

  # E2E: one job per Playwright project, each installing only the browser it needs. Headless WebGL runs on
  # SwiftShader, so a project takes a long time; the jobs run in parallel.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            extra: ''
          - project: tablet-android
            browser: chromium
            extra: ''
          # Visual baselines exist only for chromium and tablet-android (Linux), so visual.spec.ts is excluded
          # here (Playwright's --grep matches the file name as part of the test title path).
          - project: webkit
            browser: webkit
            extra: --grep-invert visual\.spec\.ts
          - project: ipad
            browser: webkit
            extra: --grep-invert visual\.spec\.ts
          - project: firefox
            browser: firefox
            extra: --grep-invert visual\.spec\.ts
    name: e2e (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }} ${{ matrix.extra }}
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results
